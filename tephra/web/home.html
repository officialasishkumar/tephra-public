<!-- Home (SPEC-v2 5.1, DESIGN 5.1): one line on what TEPHRA is and two choices, title only, Watch
     the demo (focused first) and Onboard your airline (only while the server shows onboarding;
     "Your airline workspace" when signed in). Sign in sits in the top bar. The line says a dispatcher
     approves; the decision-support sentence is not repeated in the footer (owner, 17 Oct 2026:
     "don't put this everywhere"): the demo's welcome dialog and About say it. Behind them a volcanic sky with faint drifting ash
     (home/ash.js), and beside them a picture of the five steps ending at an example advisory
