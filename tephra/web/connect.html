<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05080c">
  <meta name="description" content="TEPHRA Connect: feed your airline's aircraft positions into TEPHRA and see them checked against the volcanic ash live. Decision support only.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="TEPHRA Connect">
  <meta property="og:description" content="When official ash reports disagree, TEPHRA keeps the wider estimate, finds the flights heading in and drafts the advisory a dispatcher approves. Replay demo · fictional airline · decision support only. Connect: feed your flights in.">
  <meta property="og:image" content="https://tephra-647733667799.asia-southeast1.run.app/static/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>TEPHRA Connect</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/ibm-plex-sans-var-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/topnav.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/static/connect.css">
  <script defer src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="/static/connect.js"></script>
</head>
<!-- TEPHRA Connect (UI-DESIGN 7.24): feed your airline's positions in and watch TEPHRA check
     them against the ash. The page starts from GET /api/connect/live (so a reload is complete),
     then follows the `push` event. Built by connect.js; every string goes in through textContent. -->
<body class="cx is-loading">
  <header class="cx-bar tn-bar">
    <a class="tn-home" href="/" title="TEPHRA home">TEPHRA</a>
    <nav class="topnav" aria-label="TEPHRA pages"><a href="/">Wall</a><a href="/assistant">Assistant</a><a href="/desk">Desk</a><a href="/connect" aria-current="page">Connect</a><a href="/guide">Guide</a></nav>
    <span id="cx-mode" class="cx-mode" hidden></span>
    <span id="cx-me" class="cx-me"></span>
  </header>

  <main class="cx-main" id="main">
    <div class="cx-head">
      <h1 class="cx-title">Feed your flights. <span>Watch them meet the ash.</span></h1>
    </div>

    <section class="cx-grid" aria-label="Live intake">
      <div class="cx-stage">
        <div id="cx-map" class="cx-map" role="region" aria-label="Map of the positions arriving now"></div>
        <div class="cx-kpis" aria-live="polite">
          <div class="cx-kpi"><b id="k-rate"></b><span>positions / min</span></div>
          <div class="cx-kpi"><b id="k-live"></b><span>flights live</span></div>
          <div class="cx-kpi cx-kpi--ash"><b id="k-ash"></b><span>in the ash</span></div>
        </div>
        <div id="cx-empty" class="cx-empty" hidden>
          <div class="cx-empty__orb" aria-hidden="true"></div>
          <p class="cx-empty__t">No flights arriving</p>
          <button id="cx-empty-try" type="button" class="cx-btn cx-btn--glow" data-tab="sample" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#i-play"></use></svg><span>Try the sample feed</span></button>
          <p id="cx-empty-lock" class="cx-lock" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#i-lock"></use></svg><span>The sample feed needs a dispatcher sign-in</span></p>
        </div>
      </div>

      <aside class="cx-feed" aria-labelledby="cx-feed-t">
        <h2 id="cx-feed-t" class="cx-feed__t">Feed your data</h2>
        <div class="cx-seg" role="tablist" aria-label="How to feed">
          <button type="button" role="tab" class="cx-seg__b" data-tab="upload" aria-selected="true"><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#i-file"></use></svg><span>Upload</span></button>
          <button type="button" role="tab" class="cx-seg__b" data-tab="api" aria-selected="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#i-code"></use></svg><span>API</span></button>
          <button type="button" role="tab" class="cx-seg__b" data-tab="sample" aria-selected="false"><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#i-play"></use></svg><span>Sample</span></button>
        </div>
        <div id="cx-panel" class="cx-panel" role="tabpanel"></div>
      </aside>
    </section>

    <section aria-label="Where your data goes">
      <ul id="cx-where" class="cx-where"></ul>
    </section>

    <section class="cx-row" aria-label="Sources">
      <ul id="cx-flows" class="cx-flows"></ul>
      <ul id="cx-public" class="cx-chips" aria-label="Public feeds"></ul>
    </section>

    <section class="cx-ticker-wrap" aria-label="Pushes arriving">
      <ol id="cx-ticker" class="cx-ticker" aria-live="off"></ol>
    </section>
  </main>

  <dialog id="cx-dlg" class="cx-dlg" aria-labelledby="cx-dlg-t"></dialog>
</body>
</html>
