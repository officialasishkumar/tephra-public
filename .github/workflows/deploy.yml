name: deploy

# Every push to main deploys TEPHRA to Cloud Run through deploy/cloudrun.sh's gate: build the
# pushed commit, deploy it with no traffic as tag "candidate", read-only smoke test of the
# candidate, move traffic only if that passes, then the full smoke test. On any failure
# traffic stays where it is and the run prints the rollback command (deploy/README.md,
# "Automatic deploys"). Pause it by disabling this workflow in the Actions tab.
#
# Authentication is keyless: GitHub's OIDC token for this repository's main branch is
# exchanged through workload identity federation (set up once by deploy/github_deploy_setup.sh)
# for the deployer service account. The two values below are identifiers, not secrets.
on:
  push:
    branches: [main]
    # Only changes that can alter what runs or how it is deployed: what the image is built from
    # (the Dockerfile's COPY sources, except README.md and LICENSE, which change no behaviour),
    # the deploy scripts and this file, the smoke test that gates the rollout and the policy
    # pins it reads. Other docs and Markdown, research/, evals/, the other
    # tests and scripts, ci.yml and .claude/ do not deploy. deploy/cloudrun.sh reads this list
    # (deploy/deploy_paths.py) to tell whether a newer commit on main deploys by itself, and
    # tests/test_scripts.py checks it covers every COPY in the Dockerfile.
    paths:
      - Dockerfile
      - .dockerignore
      - .gcloudignore
      - pyproject.toml
      - uv.lock
      - "tephra/**"
      - "data/**"
      - "docs/backtest/**"
      - "docs/evals/**"
      - "deploy/**"
      - scripts/live_smoke.sh
      - tests/test_policy.py
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      skip_tests:
        description: >-
          Not read yet. Once the deploy job waits for the ci workflow (`needs: test`, added by
          the owner after 17 Oct 2026), "true" lets a manual run deploy a fix without that wait.
        type: boolean
        default: false
        required: false

# One deploy at a time, in push order. A running deploy is never cancelled (that could stop it
# between moving traffic and its smoke test); a newer push replaces any run still waiting.
concurrency:
  group: deploy-tephra-cloud-run
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  # Printed by deploy/github_deploy_setup.sh; it can write them in for you.
  TEPHRA_WIF_PROVIDER: projects/647733667799/locations/global/workloadIdentityPools/github-actions/providers/tephra-main
  TEPHRA_DEPLOY_SA: tephra-deployer@regal-wall-392020.iam.gserviceaccount.com
  # deploy/cloudrun.sh in CI mode (deploy/_common.sh): no prompt, deployer account only.
  TEPHRA_DEPLOY_CI: "true"
  TEPHRA_GITHUB_REPO: officialasishkumar/tephra
  TEPHRA_PROJECT: regal-wall-392020
  TEPHRA_GCP_REGION: asia-southeast1
  TEPHRA_SERVICE: tephra
  TEPHRA_GCS_BUCKET: tephra-regal-wall-392020-blobs
  TEPHRA_HOSTING: always-on
  TEPHRA_LLM: gemini
  # The demo configuration (deploy/README.md, "Automatic deploys"): the Krakatau window
  # played as a loop, the hero features only, visitors may decide on the Desk, the recovery
  # planner runs only when asked from the Desk, and the replay minute (every loop asks the
  # same questions at the same replay minute, so kept answers are reused at zero quota).
  TEPHRA_MODE: REPLAY
  TEPHRA_REPLAY_CASE: anak-krakatau-20260905
  # 10:25Z (owner, 16 Oct 2026): the loop opens five minutes before the 10:30Z SIGMET and Darwin
  # advisory arrive, so a visitor sees new products reach TEPHRA early in each loop. Inside the
  # case's reconstructed ADS-B (10:00Z-19:30Z); the five new minutes are asked once, then kept.
  TEPHRA_REPLAY_START: "2026-09-05T10:25:00Z"
  # 13:30Z while the answer store fills (74% of the 9-hour window's asks, the strongest
  # moment and two reissues); keys carry no window, so every answer kept now serves the long
  # loop too. Reopen to 18:35Z once the Wall shows drafts at every minute (RUNBOOK-private.md).
  TEPHRA_REPLAY_END: "2026-09-05T13:30:00Z"
  TEPHRA_AUTO_REPLAY: "false"
  # The hero path, Onboard, and the Desk's Data connections (owner, 16 Oct 2026).
  TEPHRA_FEATURES: "connect,onboard"
  TEPHRA_VISITOR_ACCESS: "replay"
  # Delete this line to refuse the replay minute (aircraft then refresh every 30 s and about
  # 100 lite calls a loop are asked again).
  TEPHRA_REPLAY_QUANTUM_S: "60"
  TEPHRA_RECOVERY_AUTO: "false"
  # Shown under Details > Runs on; the service cannot read its own region.
  TEPHRA_CLOUD_REGION: asia-southeast1
  # Held for the Desk's Ask and messages. Left out until the answer store has filled (push 4,
  # 17 Oct 2026 evening), so the fill days keep the whole lite budget for the loop.
  # TEPHRA_AI_INTERACTIVE_SHARE: "0.3"
  CLOUDSDK_CORE_DISABLE_PROMPTS: "1"

jobs:
  deploy:
    # Never on a fork, and only from main (a manual run on another branch does nothing).
    if: github.repository == 'officialasishkumar/tephra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The deploy step has its own, shorter limit, so a step that hangs is stopped while the
    # job still has time for the step after it to say where traffic was left.
    timeout-minutes: 70
    steps:
      - name: Check the workflow is set up
        run: |
          if [[ "$TEPHRA_WIF_PROVIDER" == REPLACE_WITH_* || "$TEPHRA_DEPLOY_SA" == REPLACE_WITH_* ]]; then
            echo "::error::Run deploy/github_deploy_setup.sh once, then put the two values it prints in .github/workflows/deploy.yml (TEPHRA_WIF_PROVIDER, TEPHRA_DEPLOY_SA)."
            exit 1
          fi

      # Into src/ so the credential file the auth step writes to the workspace root stays
      # outside the checkout: the tree stays clean and the file is never uploaded to Cloud Build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          project_id: ${{ env.TEPHRA_PROJECT }}
          workload_identity_provider: ${{ env.TEPHRA_WIF_PROVIDER }}
          service_account: ${{ env.TEPHRA_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ env.TEPHRA_PROJECT }}
          # GitHub's Ubuntu runners ship the Google Cloud CLI; reusing it saves about 25 s.
          skip_install: true

      - name: Build, test the candidate, move traffic, test the live URL
        id: deploy
        working-directory: src
        timeout-minutes: 55
        env:
          # cloudrun.sh records how far it got here, for the step below.
          TEPHRA_DEPLOY_STAGE_FILE: ${{ runner.temp }}/tephra-deploy-stage
        run: ./deploy/cloudrun.sh

      # When cloudrun.sh was stopped (timeout, cancelled run) or died before writing its own
      # summary, say where traffic was left and how to roll back. No gcloud here.
      - name: Report where an interrupted deploy left traffic
        if: always() && steps.deploy.outcome != 'success' && steps.deploy.outcome != 'skipped'
        env:
          STAGE_FILE: ${{ runner.temp }}/tephra-deploy-stage
          OUTCOME: ${{ steps.deploy.outcome }}
        run: ./src/deploy/report_interrupted.sh
